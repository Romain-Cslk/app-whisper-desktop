[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "transcripteur-whisper"
dynamic = ["version"]
description = "Transcription audio et vidéo, application Windows Qt native"
requires-python = ">=3.11,<3.13"
dependencies = [
  "nvidia-curand-cu12==10.3.9.90",
  "nvidia-cuda-nvrtc-cu12==12.8.93",
  "nvidia-nvjitlink-cu12==12.8.93",
  "nvidia-cufft-cu12==11.3.3.83",
  "nvidia-cudnn-cu12==9.8.0.87",
  "nvidia-cublas-cu12==12.8.5.5",
  "nvidia-cuda-runtime-cu12==12.8.90",
  "PySide6==6.8.3",
  "faster-whisper==1.2.1",
  "ctranslate2==4.6.3",
  "setuptools>=68,<81",
  "backports.tarfile>=1.2,<2",
  "av==12.2.0",
  "openai==1.109.1",
  "httpx==0.28.1",
  "requests>=2.32,<3",
  "onnxruntime==1.23.2",
  "sherpa-onnx==1.13.7+cuda12.cudnn9",
"huggingface-hub==1.1.5",
  "numpy==2.4.6",
  "SoundCard==0.4.6",
  "sounddevice==0.5.5",
  "soundfile==0.14.0",
  "tqdm>=4.66,<5",
]

[project.gui-scripts]
transcripteur-whisper = "transcripteur_whisper.app:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-qt==4.5.0", "ruff==0.16.6"]
build = ["pyinstaller==6.15.0", "setuptools>=68,<81"]

[tool.setuptools.dynamic]
version = {attr = "transcripteur_whisper.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcripteur_whisper = ["assets/*.png", "assets/*.ico", "assets/*.onnx", "assets/diarization/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["venv", ".venv", "build", "dist", "models", "src/transcripteur_whisper/assets/diarization"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
find-links = ["https://k2-fsa.github.io/sherpa/onnx/cuda.html"]
